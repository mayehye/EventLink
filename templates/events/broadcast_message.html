{% extends 'base.html' %}

{% block content %}
<div class="container py-5 d-flex justify-content-center">
    <div class="card border-0 shadow-lg p-4 p-md-5 w-100" style="max-width: 600px; border-radius: 20px;">
        
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-megaphone-fill fs-3"></i>
            </div>
            <h3 class="fw-bold" style="font-family: 'Merriweather', serif;">Broadcast Update</h3>
            <p class="text-muted small">Send an instant announcement or venue change to all ticket holders for <strong>{{ event.title }}</strong>.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3 small" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4 text-start">
                <label class="form-label fw-bold small text-muted text-uppercase">Organizer Message / Notice</label>
                <textarea class="form-control rounded-3 bg-white shadow-sm" name="message" rows="6" placeholder="Type your update, venue change, or cancellation message here..." required style="border: 2px solid #e2e8f0;"></textarea>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn text-white fw-bold py-3 shadow-sm" style="background-color: var(--primary-green); border-radius: 12px;">
                    <i class="bi bi-send-fill me-2"></i> Send Message to All Attendees
                </button>
                <a href="{% url 'events:dashboard' %}" class="btn btn-light fw-bold py-2 text-muted" style="border-radius: 12px;">
                    Back to Dashboard
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}

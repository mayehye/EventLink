{% extends 'base.html' %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card border-0 shadow-sm p-4 p-md-5 text-center" style="border-radius: 16px; max-width: 500px; width: 100%;">
        
        <i class="bi bi-exclamation-triangle text-danger mb-3" style="font-size: 4rem;"></i>
        <h2 class="fw-bold mb-3" style="font-family: 'Merriweather', serif;">Delete Event?</h2>
        
        <p class="text-muted fs-5 mb-4">
            Are you sure you want to delete <strong>"{{ event.title }}"</strong>? 
            This action cannot be undone.
        </p>
        
        <!-- UPDATED: Added the explicit action URL here -->
        <form action="{% url 'events:delete_event' event.id %}" method="POST">
            {% csrf_token %}
            <div class="d-flex gap-3">
                <a href="{% url 'events:dashboard' %}" class="btn btn-lg btn-light w-50 fw-bold border">Cancel</a>
                <button type="submit" class="btn btn-lg btn-danger w-50 fw-bold shadow-sm">Yes, Delete It</button>
            </div>
        </form>
        
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card border-0 shadow-lg p-0" style="border-radius: 20px; max-width: 500px; width: 100%; overflow: hidden;">
        
        <div class="bg-light p-4 text-center border-bottom">
            <div class="d-inline-block p-3 bg-white rounded-circle mb-3 shadow-sm">
                <i class="bi bi-check-circle-fill fs-2 text-success"></i>
            </div>
            <h3 class="fw-bold mb-1 text-success" style="font-family: 'Merriweather', serif;">Password Updated</h3>
        </div>

        <div class="p-4 p-md-5 text-center">
            <p class="text-muted mb-4 fs-5">Your password has been set successfully. You may now log in with your new password.</p>
            
            <a href="{% url 'accounts:login' %}" class="btn btn-lg w-100 fw-bold shadow-sm text-white" style="background-color: var(--primary-green); border-radius: 12px; padding: 16px;">
                Log In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}

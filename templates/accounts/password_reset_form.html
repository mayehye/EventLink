{% extends 'base.html' %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card border-0 shadow-lg p-0" style="border-radius: 20px; max-width: 500px; width: 100%; overflow: hidden;">
        
        <div class="bg-light p-4 text-center border-bottom">
            <div class="d-inline-block p-3 bg-white rounded-circle mb-3 shadow-sm">
                <i class="bi bi-shield-lock fs-2" style="color: var(--primary-green);"></i>
            </div>
            <h3 class="fw-bold mb-1" style="color: var(--primary-green); font-family: 'Merriweather', serif;">Reset Password</h3>
            <p class="text-muted mb-0">Enter your email and we will send you a secure recovery link.</p>
        </div>

        <div class="p-4 p-md-5">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small text-uppercase">Email Address</label>
                    <input type="email" name="email" class="form-control form-control-lg bg-light fw-bold" required placeholder="name@example.com">
                </div>
                
                <button type="submit" class="btn btn-lg w-100 fw-bold shadow-sm text-white" style="background-color: var(--primary-green); border-radius: 12px; padding: 16px;">
                    Send Recovery Link
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'accounts:login' %}" class="text-decoration-none text-muted small fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
